name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      mac_only:
        description: "Build macOS and attach it to an existing release"
        type: boolean
        default: false
      release_tag:
        description: "Existing release tag for mac_only (for example v0.1.0)"
        type: string
        default: "v0.1.0"

# Минимальные права: запись в релиз нужна только джобе release.
permissions:
  contents: read

jobs:
  windows:
    name: Windows 10/11 x64
    if: github.event_name != 'workflow_dispatch' || !inputs.mac_only
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-desktop.txt pyinstaller

      - name: Download Whisper model
        shell: pwsh
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-small', local_dir='build/whisper-small', allow_patterns=['model.bin','config.json','tokenizer.json','vocabulary.txt'])"
          $expected = "3e305921506d8872816023e4c273e75d2419fb89b24da97b4fe7bce14170d671"
          $actual = (Get-FileHash build\whisper-small\model.bin -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Модель Whisper не совпала по sha256: $actual" }
          Write-Host "Модель Whisper: sha256 совпал"

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = python tools/version.py
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Unit tests (затронутые изменениями)
        run: >-
          python -m unittest
          tests.test_analyze tests.test_render tests.test_cut_pauses
          tests.test_reactions tests.test_ytdlp_ffmpeg tests.test_diagnostics
          tests.test_monitor tests.test_subtitles -v

      # Полный набор — сигнал, а не блокер: на Windows могут всплыть
      # платформенные мелочи, но артефакт для теста всё равно нужен.
      - name: Full suite (не блокирует сборку)
        continue-on-error: true
        run: python -m unittest discover -s tests -t . -v

      - name: Build
        run: pyinstaller KadrFlow.spec --noconfirm --clean

      - name: Smoke test (headless HTTP)
        shell: pwsh
        run: |
          $env:KADRFLOW_HEADLESS = "1"
          $env:KADRFLOW_DATA = "$env:RUNNER_TEMP\vc-smoke"
          $env:KADRFLOW_PORT = "8799"
          $proc = Start-Process -FilePath "dist\KadrFlow\KadrFlow.exe" -PassThru
          try {
            $base = "http://127.0.0.1:8799"
            $ok = $false
            for ($i = 0; $i -lt 80; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest -UseBasicParsing "$base/api/health" -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "Приложение не ответило на /api/health" }

            # /api/system читает PDH-счётчики GPU. Раньше этот путь не проверялся
            # на реальной Windows — именно здесь мог падать процесс мониторинга.
            for ($i = 0; $i -lt 3; $i++) {
              $sys = Invoke-RestMethod "$base/api/system" -TimeoutSec 5
              if ($null -eq $sys.gpu) { throw "/api/system вернул ответ без поля gpu" }
              Write-Host ("GPU: {0} | источник: {1} | {2}%" -f $sys.gpu.name, $sys.gpu.source, $sys.gpu.percent)
              Start-Sleep -Milliseconds 400
            }

            $diag = Invoke-RestMethod "$base/api/diagnostics?tail=5" -TimeoutSec 5
            if (-not $diag.report) { throw "/api/diagnostics вернул пустой отчёт" }
            Write-Host $diag.report
          } finally {
            if (Test-Path "$env:KADRFLOW_DATA\app.log") {
              Write-Host "--- app.log (хвост) ---"
              Get-Content "$env:KADRFLOW_DATA\app.log" -Tail 120
            }
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\KadrFlow -DestinationPath "KadrFlow-${{ steps.version.outputs.value }}-windows-x64.zip"

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force .venv\tools | Out-Null
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.1.1-x64.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe" -OutFile $installer
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Pyrsys") { throw "Invalid Inno Setup signature" }
          $inno = Join-Path $env:RUNNER_TEMP "InnoSetup7"
          $proc = Start-Process $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$inno") -PassThru -Wait -WindowStyle Hidden
          if ($proc.ExitCode -ne 0) { throw "Inno Setup installation failed: $($proc.ExitCode)" }
          $webview = ".venv\tools\MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $webview
          $signature = Get-AuthenticodeSignature $webview
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft") { throw "Invalid WebView2 signature" }
          & (Join-Path $inno "ISCC.exe") "/DAppVersion=${{ steps.version.outputs.value }}" KadrFlow.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          Move-Item "release\KadrFlow-${{ steps.version.outputs.value }}-Setup-windows-x64.exe" .

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem "KadrFlow-*-windows-x64.zip", "KadrFlow-*-Setup-windows-x64.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -Encoding ascii SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            KadrFlow-*-windows-x64.zip
            KadrFlow-*-Setup-windows-x64.exe
            SHA256SUMS-windows.txt

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-desktop.txt pyinstaller

      - name: Download Whisper model
        run: |
          .venv/bin/python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-small', local_dir='build/whisper-small', allow_patterns=['model.bin','config.json','tokenizer.json','vocabulary.txt'])"
          expected=3e305921506d8872816023e4c273e75d2419fb89b24da97b4fe7bce14170d671
          actual=$(shasum -a 256 build/whisper-small/model.bin | cut -d ' ' -f 1)
          test "$actual" = "$expected"

      - name: Build and sign app
        run: bash build_app.sh

      - name: Smoke test (headless HTTP)
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.arch }}"
          app=dist/KadrFlow.app/Contents/MacOS/KadrFlow
          test -x "$app"
          export KADRFLOW_HEADLESS=1
          export KADRFLOW_DATA="$RUNNER_TEMP/kadrflow-smoke"
          export KADRFLOW_PORT=8799
          "$app" > "$RUNNER_TEMP/kadrflow.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat "$RUNNER_TEMP/kadrflow.log"' EXIT
          ready=0
          for _ in {1..80}; do
            if curl -fsS http://127.0.0.1:8799/api/health -o "$RUNNER_TEMP/health.json"; then
              ready=1
              break
            fi
            sleep 0.5
          done
          test "$ready" -eq 1
          export EXPECTED_VERSION=$(.venv/bin/python tools/version.py)
          .venv/bin/python -c 'import json,os; data=json.load(open(os.environ["RUNNER_TEMP"] + "/health.json")); assert data["ok"] and data["version"] == os.environ["EXPECTED_VERSION"], data'

      - name: Package macOS app
        run: |
          bash build_dmg.sh
          version=$(.venv/bin/python tools/version.py)
          test -s "dist/KadrFlow-${version}-macOS-${{ matrix.arch }}.zip"
          test -s "dist/KadrFlow-${version}-macOS-${{ matrix.arch }}.dmg"
          cd dist
          shasum -a 256 "KadrFlow-${version}-macOS-${{ matrix.arch }}.zip" "KadrFlow-${version}-macOS-${{ matrix.arch }}.dmg" > "SHA256SUMS-macOS-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/KadrFlow-*-macOS-${{ matrix.arch }}.zip
            dist/KadrFlow-*-macOS-${{ matrix.arch }}.dmg
            dist/SHA256SUMS-macOS-${{ matrix.arch }}.txt

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        run: echo "value=$(python3 tools/version.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-release/*
            artifacts/macos-arm64/*
            artifacts/macos-x86_64/*
          body_path: release/v${{ steps.version.outputs.value }}/RELEASE_NOTES.md
          fail_on_unmatched_files: true

  release-macos:
    name: Add macOS to existing release
    if: github.event_name == 'workflow_dispatch' && inputs.mac_only
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: artifacts
      - name: Upload macOS assets and update notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" artifacts/macos-arm64/* artifacts/macos-x86_64/* --clobber
          gh release edit "$RELEASE_TAG" --notes-file "release/${RELEASE_TAG}/RELEASE_NOTES.md"
